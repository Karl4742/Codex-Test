<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic FPS Room</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
      }

      canvas {
        display: block;
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f5f5f5;
        background: rgba(0, 0, 0, 0.65);
        text-align: center;
        cursor: pointer;
        user-select: none;
      }

      #overlay.hidden {
        display: none;
      }

      .hint {
        max-width: 32rem;
        line-height: 1.5;
        padding: 1rem;
      }

      #status {
        min-height: 1.2rem;
        color: #ffd8a8;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="hint">
        <h1>Basic First-Person Room</h1>
        <p>Click to lock the mouse and start.</p>
        <p><strong>WASD</strong>: Move &nbsp;|&nbsp; <strong>Mouse</strong>: Look &nbsp;|&nbsp; <strong>Space</strong>: Jump</p>
        <p id="status" aria-live="polite"></p>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
